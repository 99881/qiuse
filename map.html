  window.closeSheet=function(){ side.classList.remove('open'); bg.classList.remove('show'); };
  btn.addEventListener('click', function(){ side.classList.toggle('open'); bg.classList.toggle('show'); });
  bg.addEventListener('click', window.closeSheet);
  if (window.innerWidth <= 860) { setTimeout(function(){ map.invalidateSize(); }, 300); }
  window.addEventListener('resize', function(){ map.invalidateSize(); });
})();
</script>
